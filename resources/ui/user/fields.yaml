# ===================================
#  Author Form Field Definitions
# ===================================

fields:

    name:
        label: Name
        span: left

    email:
        label: Email
        type: email
        span: right

tabs:
    fields:

        password@create:
            label: Password
            commentAbove: Used to sign in.
            tab: Account
            type: password
            span: left

        password@update:
            label: Reset Password
            commentAbove: Enter a new password, or leave blank to keep the current one.
            tab: Account
            type: password
            span: left

        password_confirmation:
            label: Confirm Password
            commentAbove: Enter the password again.
            tab: Account
            type: password
            span: right

        primary_group:
            label: Primary Group
            tab: Groups
            type: relation
            span: left
            emptyOption: No group
            scope: withoutGuest

        groups:
            label: Other Groups
            tab: Groups
            type: relation
            emptyOption: There are no groups yet.
            scope: withoutGuest

        notes:
            label: Notes
            tab: Notes
            type: textarea
            size: large
            comment: Private notes for the editors, not shown on the blog.
