# ===================================
#  Author List Column Definitions
# ===================================

columns:
    name:
        label: Name
        searchable: true
        sortable: true

    email:
        label: Email Address
        searchable: true
        sortable: true

    posts_count:
        label: Posts
        type: number
        relation: posts
        relationCount: true
        sortable: true
        width: 100px

    created_at:
        label: Joined
        type: date
        sortable: true
        width: 160px
