# ===================================
#  Category Toolbar Button Definitions
# ===================================

buttons:
    create:
        label: New Category
        icon: ph ph-plus
        type: primary
        url: categories/create

    posts:
        label: Posts
        icon: ph ph-article
        type: secondary
        url: posts

    delete:
        label: Delete
        icon: ph ph-trash
        type: danger
        handler: onDelete
        confirm: Delete the checked categories and the categories below them?
        checked: true
