# ===================================
#  Group List Column Definitions
# ===================================

columns:
    name:
        label: Name
        searchable: true
        sortable: true

    code:
        label: Code
        searchable: true
        sortable: true

    users_count:
        label: Members
        type: number
        relation: users
        relationCount: true
        sortable: true
        width: 120px

    created_at:
        label: Created
        type: date
        sortable: true
        width: 160px
