fields:
    name:
        label: Name
        span: left
        required: true
        autoFocus: true
        comment: Required by the rules the controller checks on save. Clear it and save to see the error.

    email:
        label: Email
        type: email
        span: right
        comment: Checked by the controller's email rule.

    code:
        label: Code
        required: true
        comment: The required property only shows the marker, so an empty code still saves.
