# ===================================
#  Post Filter Scope Definitions
# ===================================

scopes:
    published:
        label: Published
        type: switch
        conditions:
            - published = false
            - published = true

    category:
        label: Category
        type: group
        modelClass: App\Models\Category
        nameFrom: name
        optionsScope: hasPosts

    author:
        label: Author
        type: group
        modelClass: App\Models\User
        nameFrom: name
        optionsScope: hasPosts

    tags:
        label: Tags
        type: group
        nameFrom: name
        emptyOption: Untagged

    status:
        label: Status
        type: group
        optionsMethod: 'App\Models\Post::listStatusOptions'

    hide_archived:
        label: Hide archived
        type: checkbox
        default: 1
        conditions: status <> 'archived'

    published_at:
        label: Published
        type: daterange
